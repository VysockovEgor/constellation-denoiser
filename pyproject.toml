[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation-denoiser"
version = "0.1.0"
description = "Reproducible 16-QAM neural equalizer experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "matplotlib>=3.7",
  "torch>=2.0",
  "jupyterlab>=4.0",
]

[project.optional-dependencies]
dev = ["python-pptx>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
